[package]
name = "redteam-enclave"
version = "0.1.3"
edition = "2021"
description = "near-redteam OutLayer TEE module: ECIES-sealed red-team evaluation"
license = "MIT"
publish = false

[[bin]]
name = "redteam-enclave"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"

# Randomness: on wasm use wasi 0.13 (WASI 0.2.2) directly. getrandom 0.3.4
# pulls wasip2 (WASI 0.2.12), which the OutLayer worker cannot instantiate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"
wasi = "0.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
