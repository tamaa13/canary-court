<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canary Court · demo film</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=erode@300,400,500&display=swap" />
<style>
  @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/ApfelGrotezk-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/ApfelGrotezk-Mittel.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Apfel Grotezk"; src: url("assets/fonts/ApfelGrotezk-Fett.woff2") format("woff2"); font-weight: 700; font-display: block; }

  :root {
    --paper: #f6f5f1;
    --ink: #17171a;
    --fg-2: rgb(23 23 26 / 0.68);
    --fg-3: rgb(23 23 26 / 0.55);
    --night: #0c0c0d;
    --sans: "Apfel Grotezk", ui-sans-serif, system-ui, sans-serif;
    --serif: "Erode", ui-serif, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* the review chrome around the stage (not part of the film) */
    --chrome: #141416;
    --chrome-fg: #cfcac0;
    --chrome-dim: #8a867e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--chrome); overflow: hidden; color: var(--chrome-fg); font: 13px/1.4 var(--sans); }

  #viewport { position: fixed; inset: 0 0 64px 0; }
  body.capture #viewport { inset: 0; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--paper); overflow: hidden; }

  /* layers: one per cue; the timeline shows and hides them */
  .layer { position: absolute; inset: 0; display: none; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ground-night { background: var(--night); }
  .ground-paper { background: var(--paper); }

  .sentence { font: 400 84px/1.2 var(--sans); letter-spacing: -0.014em; color: var(--ink); text-align: center; max-width: 1640px; text-wrap: balance; }
  .sentence .w { display: inline-block; will-change: transform, opacity, filter; }
  .u { text-decoration: underline; text-decoration-thickness: 0.055em; text-underline-offset: 0.17em; }
  .sub { margin-top: 30px; font: 400 30px/1.3 var(--sans); color: var(--fg-3); letter-spacing: 0.005em; }

  .clip-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.06); transform-origin: 50% 46%; }
  .caption { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: 400 80px/1.2 var(--sans); letter-spacing: -0.01em; color: #fff; text-shadow: 0 2px 14px rgb(0 0 0 / 0.35); }
  .caption .w { display: inline-block; }

  .credit { position: absolute; left: 56px; top: 44px; font: 400 20px/1.3 var(--sans); color: rgb(255 255 255 / 0.78); text-shadow: 0 1px 6px rgb(0 0 0 / 0.45); }
  .tile { position: absolute; box-shadow: 0 10px 30px rgb(0 0 0 / 0.55); background: #222; overflow: hidden; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.05); }

  .mark { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .card { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; border-radius: 10px; overflow: hidden; background: var(--paper);
          box-shadow: 0 1px 0 rgb(23 23 26 / 0.06), 0 0 0 1px rgb(23 23 26 / 0.07), 0 24px 70px rgb(23 23 26 / 0.13); }
  .spot { position: absolute; z-index: 3; border-radius: 6px; pointer-events: none; box-shadow: 0 0 0 4000px rgb(246 245 241 / 0.74); }
  .card iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; background: var(--paper); pointer-events: none; }

  .cardview { position: absolute; left: 0; top: 0; width: 1920px; overflow: hidden; }
  .viewfade { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; z-index: 4; pointer-events: none; background: linear-gradient(rgb(246 245 241 / 0), var(--paper)); }
  .flowcap { position: absolute; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding-bottom: 10px;
             font: 400 44px/1.2 var(--sans); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
  .night { position: absolute; inset: 0; background: #121214; opacity: 0; pointer-events: none; z-index: 3; }
  .term { position: absolute; left: 250px; top: 75px; width: 1420px; height: 780px; display: none; z-index: 5; overflow: hidden; border-radius: 10px; background: var(--paper);
          box-shadow: 0 1px 0 rgb(23 23 26 / 0.06), 0 0 0 1px rgb(23 23 26 / 0.07), 0 24px 70px rgb(23 23 26 / 0.13); }
  .term-bar { height: 64px; display: flex; align-items: center; padding: 0 38px; border-bottom: 1px solid rgb(23 23 26 / 0.1); font: 500 19px var(--sans); letter-spacing: 0.01em; color: var(--fg-2); }
  .term-body { padding: 34px 40px; font: 400 24px/1.62 var(--mono); color: var(--ink); }
  .tl { white-space: pre-wrap; }
  .tl.cmd { margin-top: 16px; }
  .tl.cmd:first-child { margin-top: 0; }
  .tl.cmd::before { content: "› "; color: var(--fg-3); }
  .tl.out { padding-left: 1.25em; color: var(--fg-2); }
  .tl.hi { padding-left: 1.25em; color: var(--ink); font-weight: 600; }
  .tl.caret::after { content: ""; display: inline-block; width: 0.55em; height: 1.05em; margin-left: 3px; vertical-align: -0.16em; background: var(--ink); }
  .pointer { position: absolute; left: 0; top: 0; z-index: 6; display: none; pointer-events: none; }
  .pointer svg { display: block; margin: -1.9px 0 0 -2.5px; transform-origin: 2.5px 1.9px; filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.2)); }
  .pointer .ring { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border: 1.5px solid var(--ink); border-radius: 50%; opacity: 0; }

  .figures { display: grid; grid-template-columns: repeat(3, 440px); column-gap: 110px; align-items: start; }
  .figure { text-align: center; }
  .figure .v { font: 700 132px/1 var(--sans); letter-spacing: -0.03em; color: var(--ink); }
  .figure .l { margin-top: 24px; font: 400 30px/1.32 var(--sans); color: var(--fg-2); text-wrap: balance; }

  .lockup-img { width: 600px; height: auto; display: block; }
  .tagline { margin-top: 44px; font: 400 46px/1.15 var(--serif); letter-spacing: -0.01em; color: var(--ink); }
  .url { margin-top: 22px; font: 400 21px/1 var(--sans); letter-spacing: 0.08em; color: var(--fg-3); }

  /* review controls (hidden in capture mode) */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-top: 1px solid rgb(255 255 255 / 0.07); }
  body.capture #bar, body.capture #cues { display: none !important; }
  #bar button { background: none; border: 1px solid rgb(255 255 255 / 0.16); color: var(--chrome-fg); font: 500 13px var(--sans); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  #bar button:hover { border-color: rgb(255 255 255 / 0.32); }
  #time { font: 400 13px var(--mono); color: var(--chrome-fg); min-width: 120px; }
  #cuename { font: 400 13px var(--mono); color: var(--chrome-dim); min-width: 150px; }
  #scrub { flex: 1; accent-color: #cfcac0; }
  #hint { color: var(--chrome-dim); font-size: 12px; }
  #cues { position: fixed; right: 18px; bottom: 76px; width: 430px; max-height: calc(100vh - 110px); overflow: auto; display: none; background: #1c1c1f; border: 1px solid rgb(255 255 255 / 0.1); border-radius: 8px; padding: 6px 0; }
  #cues.open { display: block; }
  #cues .row { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 7px 14px; cursor: pointer; }
  #cues .row:hover { background: rgb(255 255 255 / 0.04); }
  #cues .row.on { background: rgb(255 255 255 / 0.08); }
  #cues .t { font: 400 12px var(--mono); color: var(--chrome-dim); }
  #cues .d { color: var(--chrome-fg); }
  #cues .d small { display: block; color: var(--chrome-dim); }
  #status { position: fixed; left: 18px; top: 12px; font: 400 12px var(--mono); color: var(--chrome-dim); }
  body.capture #status { display: none; }
</style>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <div id="status"></div>
  <div id="bar">
    <button id="play" type="button">Play</button>
    <span id="time">0:00.00 / 1:25</span>
    <input id="scrub" type="range" min="0" max="85" step="0.01" value="0" aria-label="Timeline" />
    <span id="cuename"></span>
    <button id="cuebtn" type="button">Cues</button>
    <span id="hint">space play · ←/→ 1 s · shift 5 s · ,/. frame · C cues</span>
  </div>
  <div id="cues"></div>
  <script src="film.js"></script>
</body>
</html>
