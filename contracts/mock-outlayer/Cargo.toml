[package]
name = "mock-outlayer"
description = "Sandbox-only stand-in for outlayer.testnet: returns a scripted enclave verdict. Never deployed to testnet."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
